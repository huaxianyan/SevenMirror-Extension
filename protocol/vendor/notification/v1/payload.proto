syntax = "proto3";

package notification.mirroring.v1;

option go_package = "github.com/huaxianyan/SyncNotifications-Server/protocol/generated/notification/v1;notificationv1";
option java_package = "dev.notificationmirroring.protocol.generated.v1";
option java_multiple_files = true;
option java_outer_classname = "PayloadProto";

// EncryptedPayload is serialized before HPKE sealing. Its type and every
// business field are opaque to the relay.
message EncryptedPayload {
  uint32 schema_version = 1;

  oneof body {
    ActionInvoke action_invoke = 10;
    ActionResult action_result = 11;
  }
}

// ActionInvoke asks the source Android device to invoke one action currently
// exposed by a specific notification revision. pendingIntent is never sent.
message ActionInvoke {
  string notification_id = 1;
  uint64 notification_revision = 2;
  bytes action_id = 3;
  bytes idempotency_key = 4;
  optional string reply_text = 5;
}

// ActionResult reports the locally observed result without claiming that the
// source application's remote service completed its business operation.
message ActionResult {
  bytes idempotency_key = 1;
  ActionResultStatus status = 2;
  optional string detail = 3;
}

enum ActionResultStatus {
  ACTION_RESULT_STATUS_UNSPECIFIED = 0;
  ACTION_RESULT_STATUS_SUCCEEDED = 1;
  ACTION_RESULT_STATUS_NOTIFICATION_NOT_FOUND = 2;
  ACTION_RESULT_STATUS_STALE_NOTIFICATION_VERSION = 3;
  ACTION_RESULT_STATUS_ACTION_NOT_FOUND = 4;
  ACTION_RESULT_STATUS_TEXT_REQUIRED = 5;
  ACTION_RESULT_STATUS_TEXT_NOT_SUPPORTED = 6;
  ACTION_RESULT_STATUS_PENDING_INTENT_CANCELLED = 7;
  ACTION_RESULT_STATUS_INTERNAL_ERROR = 8;
  // The operation tuple was committed but a crash prevented a reliable local
  // result from being stored. The operation MUST NOT be executed again.
  ACTION_RESULT_STATUS_OUTCOME_UNKNOWN = 9;
}
