<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="interactionPageTitle">SevenMirror</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header class="page-header">
        <span class="brand" data-i18n="interactionPageTitle">SevenMirror</span>
        <p id="source" class="source"></p>
        <p id="source-application" class="source"></p>
      </header>

      <article id="notification" class="notification" hidden>
        <h1 id="notification-title"></h1>
        <p id="notification-body" class="notification-body"></p>
      </article>

      <section id="actions-section" aria-labelledby="actions-title" hidden>
        <h2 id="actions-title" data-i18n="interactionActionsTitle">Actions</h2>
        <div id="actions" class="actions"></div>
        <button id="dismiss" class="secondary" type="button" data-i18n="notificationDismissButton">Clear</button>
      </section>

      <section id="empty" class="empty" role="status" hidden>
        <h1 data-i18n="interactionUnavailableTitle">This notification is no longer available</h1>
        <p data-i18n="interactionUnavailableBody">It may have been cleared or updated on your Android device.</p>
      </section>

      <p id="status" class="status" role="status" aria-live="polite" data-i18n="interactionLoading">Loading notification…</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
