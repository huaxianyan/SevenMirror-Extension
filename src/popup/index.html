<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="appName">SevenMirror</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <h1 data-i18n="appName">SevenMirror</h1>
        <div class="header-actions">
          <button id="mark-all-read" class="pill" type="button" data-i18n="popupMarkAllRead" hidden>Mark all read</button>
          <button id="clear-history" class="pill" type="button" data-i18n="popupClearHistory" hidden>Clear history</button>
          <button id="open-options" class="icon-button" type="button" data-i18n-aria-label="popupTabSettings" aria-label="Settings">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
              <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
            </svg>
          </button>
        </div>
      </header>

      <p id="connection-status" class="connection-status" role="status" data-i18n="popupLoading">Loading…</p>

      <div class="search-row">
        <label class="search">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="6.5" /><path d="m16 16 4 4" />
          </svg>
          <input id="search-input" type="search" data-i18n-placeholder="popupSearchPlaceholder" autocomplete="off" />
          <button id="search-clear" class="clear" type="button" data-i18n-aria-label="popupSearchClear" aria-label="Clear search" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true" focusable="false">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </label>
      </div>

      <section id="list-view" aria-labelledby="notifications-title">
        <h2 id="notifications-title" class="visually-hidden" data-i18n="popupCurrentNotifications">Current notifications</h2>
        <p id="result-summary" class="result-line" hidden></p>
        <div id="notification-list" class="notification-list"></div>
        <div id="empty" class="empty" role="status" hidden>
          <h2 id="empty-title"></h2>
          <p id="empty-body"></p>
        </div>
      </section>

      <section id="detail-view" class="detail-view" hidden>
        <button id="back-to-list" class="back-button" type="button" data-i18n-aria-label="popupBackToNotifications" aria-label="Back to notifications">
          <!-- 图标按钮：文案只留作无障碍名，所以这里不能带 data-i18n——localizeDocument 会把
               data-i18n 元素的值写进 textContent，那会把这段 SVG 一起擦掉。 -->
          <svg class="back-button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
          </svg>
        </button>
        <div id="notification-detail"></div>
      </section>

      <nav id="tabbar" class="tabbar" aria-label="SevenMirror">
        <button id="tab-unread" class="tab" type="button" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" focusable="false">
            <path d="M12 4a6 6 0 0 0-6 6v3.5L4.5 17h15L18 13.5V10a6 6 0 0 0-6-6Z" /><path d="M9.5 19.5a2.5 2.5 0 0 0 5 0" />
          </svg>
          <span data-i18n="popupTabUnread">Unread</span>
        </button>
        <button id="tab-history" class="tab" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="8" /><path d="M12 8v4.5l3 1.8" />
          </svg>
          <span data-i18n="popupTabHistory">History</span>
        </button>
      </nav>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
