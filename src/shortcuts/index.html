<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="shortcutSettingsTitle">Notification shortcuts</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">SevenMirror</p>
        <h1 data-i18n="shortcutSettingsTitle">Notification shortcuts</h1>
        <p class="intro" data-i18n="shortcutSettingsDescription">
          Choose which source actions can appear in the two native notification button slots.
        </p>
      </header>

      <section class="panel">
        <label class="toggle-row">
          <span>
            <strong data-i18n="shortcutPinClear">Always show Clear</strong>
            <small data-i18n="shortcutPinClearDescription">Reserves one button slot for clearing the source notification.</small>
          </span>
          <input id="pin-dismiss" type="checkbox" />
        </label>
      </section>

      <section class="rules-section" aria-labelledby="rules-title">
        <div class="section-heading">
          <div>
            <h2 id="rules-title" data-i18n="shortcutPriorityRules">Priority rules</h2>
            <p data-i18n="shortcutPriorityDescription">Rules are checked from top to bottom. Drag them to change priority.</p>
          </div>
          <button id="add-rule" type="button" data-i18n="shortcutAddRule">Add rule</button>
        </div>
        <ol id="rules" class="rules"></ol>
        <p id="empty-rules" class="empty" data-i18n="shortcutNoRules">No priority rules. Unmatched actions stay in More.</p>
      </section>

      <footer>
        <button id="save" class="primary" type="button" data-i18n="shortcutSave">Save changes</button>
        <p id="status" role="status" aria-live="polite"></p>
      </footer>
    </main>
    <template id="rule-template">
      <li class="rule" draggable="true">
        <div class="drag-handle" aria-hidden="true">⋮⋮</div>
        <div class="rule-fields">
          <label>
            <span data-i18n="shortcutMatch">Match</span>
            <select class="match-kind">
              <option value="reply" data-i18n="shortcutMatchReply">Needs a reply</option>
              <option value="title-exact" data-i18n="shortcutMatchExact">Action title is exactly</option>
              <option value="title-contains" data-i18n="shortcutMatchContains">Action title contains</option>
            </select>
          </label>
          <label class="title-field">
            <span data-i18n="shortcutActionTitle">Action title</span>
            <input class="match-value" type="text" maxlength="256" autocomplete="off" />
          </label>
          <label>
            <span data-i18n="shortcutApplication">Source application</span>
            <select class="application"></select>
          </label>
        </div>
        <div class="rule-actions">
          <button class="move-up" type="button" data-i18n-aria-label="shortcutMoveUp">↑</button>
          <button class="move-down" type="button" data-i18n-aria-label="shortcutMoveDown">↓</button>
          <button class="remove" type="button" data-i18n="shortcutRemoveRule">Remove</button>
        </div>
      </li>
    </template>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
